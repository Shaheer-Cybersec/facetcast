<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facetcast</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 11 16 30 3 11Z' fill='%238B7CFF'/%3E%3Cpath d='M16 2 21 11H11Z' fill='%23FFB547'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#" data-act="home" aria-label="Facetcast home">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A99BFF"/><stop offset="1" stop-color="#6A5AF9"/></linearGradient></defs><path d="M16 2 29 11 16 30 3 11Z" fill="url(#gg)"/><path d="M16 2 21 11H11Z" fill="#FFB547"/><path d="M3 11h26L16 30Z" fill="#000" opacity=".18"/></svg>
    <span>Facetcast</span>
  </a>
  <select id="runSel" aria-label="Runs"></select>
  <button class="btn sm" data-act="home">+ New</button>
  <span class="grow"></span>
  <button class="link" data-act="memory">Memory</button>
  <button class="enginepill" id="enginePill" data-act="engines"></button>
  <button class="iconbtn" data-act="theme-toggle" aria-label="Toggle light or dark" title="Light / dark">◐</button>
</header>
<main id="view" class="wrap"></main>
<div id="drawer" class="drawer" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
